<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>βフルクトース 裏返し3Dモデル</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f6f5f1; color: #222; }
  header { padding: 12px 14px 4px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .hint { font-size: 12px; color: #666; margin: 0; }
  #wrap { position: relative; margin: 8px 10px; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
  canvas { display: block; width: 100%; touch-action: none; }
  #status { position: absolute; left: 10px; top: 8px; font-size: 13px; font-weight: bold; padding: 4px 8px; border-radius: 8px; background: #eef3ff; color: #2a4cb0; }
  #status.bad { background: #ffecec; color: #b42a2a; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 10px; }
  button { flex: 1 1 45%; padding: 11px 6px; font-size: 14px; border: none; border-radius: 10px; background: #2f5bd3; color: #fff; font-weight: bold; }
  button.mirror { background: #c94545; }
  button.sub { background: #888; }
  button:disabled { opacity: .5; }
  table { border-collapse: collapse; margin: 8px 10px; width: calc(100% - 20px); font-size: 13px; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #eee; }
  th { background: #f0f0f0; }
  .note { font-size: 13px; line-height: 1.6; margin: 6px 14px 20px; }
  .up { color: #2f5bd3; font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>βフルクトースの「裏返し」3Dモデル</h1>
  <p class="hint">指でドラッグすると視点を回せるよ</p>
</header>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="status">元の形（βフルクトース）</div>
</div>

<div class="btns">
  <button id="flip">裏返す（回転）</button>
  <button id="mirror" class="mirror">上下だけ逆にする</button>
  <button id="reset" class="sub">元に戻す</button>
  <button id="view" class="sub">視点リセット</button>
</div>

<table id="tbl">
  <thead><tr><th>炭素</th><th>位置</th><th>上</th><th>下</th></tr></thead>
  <tbody></tbody>
</table>

<div class="note">
  <b>裏返す（青）</b>：手前→奥の軸のまわりに180°回すだけ。上下も左右も入れ替わるけど、同じ分子。<br>
  <b>上下だけ逆（赤）</b>：左右はそのまま上下だけ入れ替え。鏡に映したのと同じで、どう回しても元に重ならない＝別の分子（鏡像異性体）。<br>
  どちらも試したあと、ドラッグで回して元の形と見比べてみてね。
</div>

<script>
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const statusEl = document.getElementById('status');
  const tbody = document.querySelector('#tbl tbody');

  // 環は水平面(xz)、yが上。Oが奥(z負)、C2が右、C5が左（教科書の上の図と同じ向き）
  const ring = {
    O:  [0, 0, -1.0],
    C2: [0.95, 0, -0.31],
    C3: [0.59, 0, 0.81],
    C4: [-0.59, 0, 0.81],
    C5: [-0.95, 0, -0.31]
  };
  // 置換基: [付く炭素, ラベル, 上(1)/下(-1), 種類]
  const subs = [
    ['C2', 'OH', 1, 'oh'],
    ['C2', 'CH₂OH(1)', -1, 'ch'],
    ['C3', 'OH', 1, 'oh'],
    ['C3', 'H', -1, 'h'],
    ['C4', 'H', 1, 'h'],
    ['C4', 'OH', -1, 'oh'],
    ['C5', 'CH₂OH(6)', 1, 'ch'],
    ['C5', 'H', -1, 'h']
  ];

  const nodes = [];
  const bonds = [];
  function addNode(id, label, pos, kind) { nodes.push({ id, label, p: pos, kind }); return nodes.length - 1; }
  const idx = {};
  idx.O = addNode('O', 'O', ring.O, 'ringO');
  ['C2', 'C3', 'C4', 'C5'].forEach(c => { idx[c] = addNode(c, c, ring[c], 'c'); });
  [['O', 'C2'], ['C2', 'C3'], ['C3', 'C4'], ['C4', 'C5'], ['C5', 'O']].forEach(b => bonds.push([idx[b[0]], idx[b[1]], true]));
  subs.forEach(s => {
    const c = ring[s[0]];
    const out = 0.35; // 少し外側へ
    const len = Math.hypot(c[0], c[2]);
    const p = [c[0] + c[0] / len * out, s[2] * 0.95, c[2] + c[2] / len * out];
    const i = addNode(s[0] + s[1], s[1], p, s[3]);
    s.push(i);
    bonds.push([idx[s[0]], i, false]);
  });

  // 状態
  let theta = 0;       // 手前-奥(z)軸まわりの回転
  let mirror = 1;      // yの符号（1→-1で鏡像）
  let flipped = false, mirrored = false;
  let anim = null;
  let yaw = 0, pitch = 0.42; // 視点（少し上から見る＝ハース式っぽく）

  function model(p) {
    const x = p[0], y = p[1] * mirror, z = p[2];
    const c = Math.cos(theta), s = Math.sin(theta);
    return [x * c - y * s, x * s + y * c, z];
  }
  function view(p) {
    let [x, y, z] = p;
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    [x, z] = [x * cy + z * sy, -x * sy + z * cy];
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    [y, z] = [y * cp + z * sp, -y * sp + z * cp];
    return [x, y, z];
  }

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth;
    H = Math.min(W * 0.95, 420);
    cv.style.height = H + 'px';
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function project(v) {
    const scale = Math.min(W, H) * 0.3;
    const camZ = 5;
    const f = camZ / (camZ - v[2]);
    return [W / 2 + v[0] * scale * f, H / 2 + 10 - v[1] * scale * f, f];
  }

  const colors = {
    ringO: ['#e04848', '#fff'], c: ['#555', '#fff'], oh: ['#ffdede', '#c02020'],
    h: ['#eeeeee', '#444'], ch: ['#e3ecff', '#2a4cb0']
  };

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const world = nodes.map(n => model(n.p));
    const v = world.map(view);
    const pr = v.map(project);

    // 環の面をうっすら塗る
    const ringIds = ['O', 'C2', 'C3', 'C4', 'C5'].map(k => idx[k]);
    ctx.beginPath();
    ringIds.forEach((i, k) => { k ? ctx.lineTo(pr[i][0], pr[i][1]) : ctx.moveTo(pr[i][0], pr[i][1]); });
    ctx.closePath();
    ctx.fillStyle = 'rgba(120,140,200,0.12)';
    ctx.fill();

    // 結合（奥から）
    const bs = bonds.map(b => ({ b, z: (v[b[0]][2] + v[b[1]][2]) / 2 })).sort((a, b) => a.z - b.z);
    bs.forEach(({ b }) => {
      const a = pr[b[0]], c = pr[b[1]];
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]);
      ctx.strokeStyle = b[2] ? '#333' : '#888';
      ctx.lineWidth = b[2] ? 4 * (a[2] + c[2]) / 2 : 2;
      ctx.stroke();
    });

    // 原子（奥から）
    const order = nodes.map((n, i) => i).sort((a, b) => v[a][2] - v[b][2]);
    order.forEach(i => {
      const n = nodes[i], p = pr[i];
      const [bg, fg] = colors[n.kind];
      ctx.font = 'bold ' + Math.round(13 * p[2]) + 'px sans-serif';
      const tw = ctx.measureText(n.label).width;
      const r = Math.max(14 * p[2], tw / 2 + 6);
      ctx.beginPath();
      if (n.kind === 'ch') {
        const h = 14 * p[2];
        ctx.roundRect ? ctx.roundRect(p[0] - r, p[1] - h, r * 2, h * 2, h) : ctx.rect(p[0] - r, p[1] - h, r * 2, h * 2);
      } else {
        ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
      }
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n.label, p[0], p[1] + 1);
    });

    updateTable(world);
  }

  function updateTable(world) {
    let html = '';
    ['C2', 'C3', 'C4', 'C5'].forEach(c => {
      const mine = subs.filter(s => s[0] === c);
      const a = mine[0], b = mine[1];
      const ya = world[a[4]][1], yb = world[b[4]][1];
      const up = ya >= yb ? a : b, dn = ya >= yb ? b : a;
      const x = world[idx[c]][0];
      const side = Math.abs(x) < 0.3 ? '中央' : (x < 0 ? '左' : '右');
      html += `<tr><td>${c}</td><td>${side}</td><td class="up">${up[1]}</td><td>${dn[1]}</td></tr>`;
    });
    tbody.innerHTML = html;
  }

  function animate(fromT, toT, fromM, toM, done) {
    if (anim) cancelAnimationFrame(anim);
    const start = performance.now(), dur = 1400;
    setBtns(true);
    function step(now) {
      let k = Math.min(1, (now - start) / dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      theta = fromT + (toT - fromT) * e;
      mirror = fromM + (toM - fromM) * e;
      draw();
      if (k < 1) anim = requestAnimationFrame(step);
      else { anim = null; setBtns(false); done && done(); }
    }
    anim = requestAnimationFrame(step);
  }

  function setBtns(dis) {
    document.querySelectorAll('button').forEach(b => { if (b.id !== 'view') b.disabled = dis; });
  }

  function setStatus() {
    statusEl.classList.remove('bad');
    if (mirrored && flipped) { statusEl.textContent = '鏡像を回転したもの（別の分子）'; statusEl.classList.add('bad'); }
    else if (mirrored) { statusEl.textContent = '上下だけ逆＝鏡像（別の分子！）'; statusEl.classList.add('bad'); }
    else if (flipped) statusEl.textContent = '裏返した形（同じβフルクトース）';
    else statusEl.textContent = '元の形（βフルクトース）';
  }

  document.getElementById('flip').onclick = () => {
    const to = flipped ? 0 : Math.PI;
    animate(theta, to, mirror, mirror, () => { flipped = !flipped; setStatus(); });
  };
  document.getElementById('mirror').onclick = () => {
    const to = mirrored ? 1 : -1;
    animate(theta, theta, mirror, to, () => { mirrored = !mirrored; setStatus(); });
  };
  document.getElementById('reset').onclick = () => {
    animate(theta, 0, mirror, 1, () => { flipped = false; mirrored = false; setStatus(); });
  };
  document.getElementById('view').onclick = () => { yaw = 0; pitch = 0.42; draw(); };

  // ドラッグで視点回転
  let dragging = false, lx = 0, ly = 0;
  cv.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw += (e.clientX - lx) * 0.01;
    pitch += (e.clientY - ly) * 0.01;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));
    lx = e.clientX; ly = e.clientY;
    draw();
  });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { dragging = false; }));

  window.addEventListener('resize', resize);
  resize();
  setStatus();
})();
</script>
</body>
</html>
